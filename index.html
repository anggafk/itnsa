<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARSIP ITNSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --sauber-blue: #002D72;
            --petronas-cyan: #00A19C;
            --speed-white: #FDFDFD;
            --red-bull-red: #E10600;
            /* Warna Brand */
            --insta-pink: #E4405F;
            --yt-red: #FF0000;
            --tiktok-black: #000000;
            --fb-blue: #1877F2;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--speed-white);
            color: #1e293b;
            height: 100vh;
            overflow: hidden;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--petronas-cyan); }

        /* Social Link Styles */
        .social-link { color: rgba(255, 255, 255, 0.5); transition: all 0.3s ease; }
        .social-link:hover { transform: translateY(-1px); opacity: 1 !important; }
        .social-link.insta:hover { color: var(--insta-pink) !important; }
        .social-link.yt:hover { color: var(--yt-red) !important; }
        .social-link.tiktok:hover { color: #fff !important; }
        .social-link.fb:hover { color: var(--fb-blue) !important; }

        /* UI Components */
        .sidebar-item:hover { background-color: #f1f5f9; }
        .sidebar-active { background-color: #eff6ff; border-right: 3px solid var(--petronas-cyan); color: var(--sauber-blue); font-weight: 700; }
        
        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        .stat-card:hover { border-color: var(--petronas-cyan); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }

        .loader {
            border-top-color: var(--petronas-cyan);
            animation: spinner 1.2s linear infinite;
        }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .file-row:hover { background-color: #f8fafc; }

        /* Kartu buku */
        .book, .book-folder {
            position: relative;
            aspect-ratio: 210 / 297;
            overflow: hidden;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .book {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 3px 8px 8px 3px;
            box-shadow: 0 1px 2px rgba(0, 45, 114, 0.12), 0 8px 16px -8px rgba(0, 45, 114, 0.28);
        }
        .book::before {
            content: '';
            position: absolute; inset: 0 auto 0 0; width: 10px; z-index: 2;
            background: linear-gradient(90deg, rgba(0, 45, 114, 0.30), rgba(0, 45, 114, 0.07) 65%, transparent);
            border-right: 1px solid rgba(0, 45, 114, 0.10);
            pointer-events: none;
        }
        .book-folder {
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #e6f6f5, #ffffff 70%);
            border: 1px solid rgba(0, 161, 156, 0.28);
            border-radius: 10px;
            color: var(--petronas-cyan);
        }
        .card:hover .book, .card:hover .book-folder,
        .card:focus-within .book, .card:focus-within .book-folder {
            transform: translateY(-3px);
            box-shadow: 0 2px 4px rgba(0, 45, 114, 0.12), 0 14px 22px -10px rgba(0, 161, 156, 0.45);
        }
        .card-actions { opacity: 0; transition: opacity 0.15s ease; }
        .card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
        @media (hover: none) { .card-actions { opacity: 1; } }
        .ext-chip {
            position: absolute; right: 8px; bottom: 8px; z-index: 3; pointer-events: none;
            font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 500;
            letter-spacing: 0.05em; color: #fff; background: rgba(0, 45, 114, 0.85);
            padding: 2px 6px; border-radius: 4px;
        }
        @media (prefers-reduced-motion: reduce) {
            .book, .book-folder, .card-actions { transition: none; }
            .card:hover .book, .card:hover .book-folder { transform: none; }
        }

        /* Modal Preview */
        #preview-modal.open { display: flex; }
        #preview-modal.open #preview-box { animation: pop 0.18s ease-out; }
        @keyframes pop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        @media (prefers-reduced-motion: reduce) { #preview-modal.open #preview-box { animation: none; } }
        .pv-btn { transition: all 0.15s ease; }
        .pv-btn[disabled] { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body class="flex flex-col">

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span class="hidden sm:inline">Download</span>

    <script>
        const USER = 'anggafk';
        const REPO = 'itnsa';
        const BRANCH = 'main';
        let currentPath = '';
        let allFiles = []; 
        let fullTree = []; 
        let isSearchMode = false;

        const TEXT_EXT = ['txt','md','json','csv','tsv','log','js','ts','jsx','tsx','css','html','htm','xml','yml','yaml','ini','cfg','conf','rsc','sh','bat','ps1','py','php','java','c','cpp','h','sql','rb','go'];
        const IMG_EXT = ['png','jpg','jpeg','gif','webp','svg','bmp','ico'];
        const MAX_TEXT_CHARS = 300000;

        const fileGrid = document.getElementById('file-grid');
        const backBar = document.getElementById('back-bar');
        const sidebarTree = document.getElementById('sidebar-tree');
        const loadingEl = document.getElementById('loading');
        const emptyStateEl = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const breadcrumbsEl = document.getElementById('breadcrumbs');

        const modal = document.getElementById('preview-modal');
        const pvTitle = document.getElementById('pv-title');
        const pvMeta = document.getElementById('pv-meta');
        const pvBody = document.getElementById('pv-body');
        const pvNewTab = document.getElementById('pv-newtab');
        const pvDownload = document.getElementById('pv-download');
        const pvClose = document.getElementById('pv-close');

        let pvToken = 0;        // untuk batalin hasil fetch lama kalau popup sudah ditutup/ganti
        let pvBlobUrl = null;   // blob URL aktif (PDF) biar bisa di-revoke
        let pvOpenUrl = null;   // URL yang dibuka saat klik "Tab baru"

        /* ---------- Helper ---------- */
        function encodePath(p) { return p.split('/').map(encodeURIComponent).join('/'); }
        function rawUrl(p) { return `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${encodePath(p)}`; }
        function githubUrl(p, isDir) { return `https://github.com/${USER}/${REPO}/${isDir ? 'tree' : 'blob'}/${BRANCH}/${encodePath(p)}`; }
        function getExt(name) { const i = name.lastIndexOf('.'); return i === -1 ? '' : name.slice(i + 1).toLowerCase(); }
        function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        function formatBytes(bytes, decimals = 1) {
            if (!bytes) return '0 B';
            const k = 1024, i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
        }

        /* ---------- Download (jalan juga untuk link lintas-domain) ---------- */
        async function downloadFile(path, name) {
            try {
                const res = await fetch(rawUrl(path));
                if (!res.ok) throw new Error('fetch gagal');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 3000);
            } catch (e) {
                window.open(rawUrl(path), '_blank', 'noopener');
            }
        }

        /* ---------- Preview ---------- */
        function setBody(html) { pvBody.innerHTML = html; }

        function showPvLoading() {
            setBody(`<div class="absolute inset-0 flex flex-col items-center justify-center bg-white">
                <div class="loader rounded-full border-4 border-slate-200 h-10 w-10 mb-3"></div>
                <p class="text-[#00A19C] font-black text-[10px] uppercase tracking-widest animate-pulse font-mono">Loading preview...</p>
            </div>`);
        }

        function showPvMessage(title, text) {
            setBody(`<div class="absolute inset-0 flex flex-col items-center justify-center text-center px-6 bg-white">
                <svg class="w-12 h-12 text-slate-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-slate-600 font-bold text-sm">${escapeHtml(title)}</p>
                <p class="text-slate-400 text-xs mt-1 max-w-sm">${escapeHtml(text)}</p>
            </div>`);
        }

        function releaseBlob() {
            if (pvBlobUrl) { URL.revokeObjectURL(pvBlobUrl); pvBlobUrl = null; }
        }

        async function openPreview(path, name, size) {
            const token = ++pvToken;
            const ext = getExt(name);

            releaseBlob();
            pvOpenUrl = null;
            pvTitle.textContent = name;
            pvMeta.textContent = `${path}${size ? ' · ' + formatBytes(size) : ''}`;
            pvDownload.onclick = () => downloadFile(path, name);
            pvNewTab.disabled = true;
            pvNewTab.onclick = () => { if (pvOpenUrl) window.open(pvOpenUrl, '_blank', 'noopener'); };

            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
            showPvLoading();

            try {
                if (ext === 'pdf') {
                    const res = await fetch(rawUrl(path));
                    if (!res.ok) throw new Error('Gagal mengambil file (' + res.status + ')');
                    const buf = await res.arrayBuffer();
                    if (token !== pvToken) return;
                    pvBlobUrl = URL.createObjectURL(new Blob([buf], { type: 'application/pdf' }));
                    pvOpenUrl = pvBlobUrl;
                    setBody(`<iframe src="${pvBlobUrl}" title="Preview PDF" class="absolute inset-0 w-full h-full border-0 bg-white"></iframe>`);
                } else if (IMG_EXT.includes(ext)) {
                    pvOpenUrl = rawUrl(path);
                    setBody(`<div class="absolute inset-0 flex items-center justify-center p-4 overflow-auto bg-white">
                        <img src="${rawUrl(path)}" alt="${escapeHtml(name)}" class="max-w-full max-h-full object-contain"></div>`);
                } else if (TEXT_EXT.includes(ext)) {
                    const res = await fetch(rawUrl(path));
                    if (!res.ok) throw new Error('Gagal mengambil file (' + res.status + ')');
                    let text = await res.text();
                    if (token !== pvToken) return;
                    pvOpenUrl = rawUrl(path);
                    let note = '';
                    if (text.length > MAX_TEXT_CHARS) {
                        text = text.slice(0, MAX_TEXT_CHARS);
                        note = '<p class="px-4 py-2 text-[11px] text-amber-700 bg-amber-50 border-b border-amber-100">File besar, hanya sebagian awal yang ditampilkan. Klik "Tab baru" untuk lihat seluruhnya.</p>';
                    }
                    pvBody.innerHTML = `<div class="absolute inset-0 overflow-auto bg-white">${note}<pre class="font-mono text-[13px] leading-relaxed text-slate-700 p-4 whitespace-pre-wrap break-words"></pre></div>`;
                    pvBody.querySelector('pre').textContent = text || '(file kosong)';
                } else {
                    showPvMessage('File ini belum bisa dipreview', `Format .${ext || 'tanpa-ekstensi'} tidak didukung untuk preview. Silakan download file-nya.`);
                    return;
                }
                if (token === pvToken) pvNewTab.disabled = false;
            } catch (err) {
                if (token !== pvToken) return;
                showPvMessage('Preview gagal dimuat', err.message + '. Coba buka lewat GitHub atau download.');
            }
        }

        function closePreview() {
            pvToken++;
            modal.classList.remove('open');
            document.body.style.overflow = '';
            setBody('');
            releaseBlob();
            pvOpenUrl = null;
        }

        pvClose.addEventListener('click', closePreview);
        modal.addEventListener('click', (e) => { if (e.target === modal) closePreview(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closePreview(); });

        /* ---------- Data GitHub ---------- */
        async function fetchFullTree() {
            const url = `https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
            try {
                const response = await fetch(url);
                if (!response.ok) return;
                const data = await response.json();
                fullTree = data.tree || [];
                buildFolderCovers();
                applyFolderCovers();
                renderSidebarFolders();
            } catch (e) { console.error(e); }
        }

        function renderSidebarFolders() {
            sidebarTree.innerHTML = '';
            const rootBtn = document.createElement('button');
            rootBtn.className = `w-full flex items-center gap-3 px-6 py-2 transition text-slate-500 hover:bg-slate-100 ${currentPath === '' ? 'sidebar-active' : ''}`;
            rootBtn.onclick = () => fetchContents('');
            rootBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> <span class="truncate">Root Project</span>`;
            sidebarTree.appendChild(rootBtn);

            const folders = fullTree.filter(i => i.type === 'tree' && !i.path.includes('/'));
            folders.forEach(folder => {
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center gap-3 px-6 py-2 transition text-slate-500 hover:bg-slate-100 ${currentPath === folder.path ? 'sidebar-active' : ''}`;
                btn.onclick = () => fetchContents(folder.path);
                btn.innerHTML = `<svg class="w-4 h-4 text-slate-400" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg> <span class="truncate">${escapeHtml(folder.path)}</span>`;
                sidebarTree.appendChild(btn);
            });
        }

        async function fetchContents(path = '') {
            currentPath = path;
            isSearchMode = false;
            showLoading(true);
            updateBreadcrumbs(path);
            renderSidebarFolders();
            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${encodePath(path)}`);
                if (!response.ok) throw new Error('API limit or connection error');
                const data = await response.json();
                allFiles = Array.isArray(data) ? data : [data];
                allFiles.sort((a, b) => (a.type === b.type) ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1));
                renderFiles(allFiles);
            } catch (error) {
                fileGrid.innerHTML = `<p class="col-span-full py-20 text-center text-red-500 font-mono text-xs italic">[ SYSTEM ERROR: ${escapeHtml(error.message)} ]</p>`;
                backBar.classList.add('hidden');
                showLoading(false);
            }
        }

        /* ---------- Cover buku (PDF.js) ---------- */
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        const COVER_WIDTH = 420;                 // lebar render cover (px)
        const COVER_CONCURRENCY = 2;             // maksimal PDF yang diproses bersamaan
        const COVER_MAX_BYTES = 25 * 1024 * 1024; // PDF lebih besar dari ini tidak dibuat cover
        const coverCache = new Map();
        const scrollArea = document.getElementById('scroll-area');
        let coverQueue = [];
        let coverActive = 0;

        const coverObserver = new IntersectionObserver((entries) => {
            entries.forEach(en => {
                if (!en.isIntersecting) return;
                coverObserver.unobserve(en.target);
                const job = en.target._coverJob;
                if (job) { coverQueue.push(job); pumpCovers(); }
            });
        }, { root: scrollArea, rootMargin: '300px' });

        function pumpCovers() {
            while (coverActive < COVER_CONCURRENCY && coverQueue.length) {
                const job = coverQueue.shift();
                if (!job.el.isConnected) continue;
                coverActive++;
                loadCover(job)
                    .catch(() => { if (job.el.isConnected) applyCoverFallback(job.el); })
                    .finally(() => { coverActive--; pumpCovers(); });
            }
        }

        async function loadCover(job) {
            if (!window.pdfjsLib) throw new Error('PDF.js tidak termuat');
            if (job.size > COVER_MAX_BYTES) throw new Error('File terlalu besar');
            const res = await fetch(rawUrl(job.path));
            if (!res.ok) throw new Error('Gagal mengambil file');
            const data = new Uint8Array(await res.arrayBuffer());
            const pdf = await pdfjsLib.getDocument({ data }).promise;
            try {
                const page = await pdf.getPage(1);
                const base = page.getViewport({ scale: 1 });
                const vp = page.getViewport({ scale: COVER_WIDTH / base.width });
                const canvas = document.createElement('canvas');
                canvas.width = Math.floor(vp.width);
                canvas.height = Math.floor(vp.height);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                await page.render({ canvasContext: ctx, viewport: vp }).promise;
                const url = canvas.toDataURL('image/jpeg', 0.82);
                coverCache.set(job.path, url);
                if (job.el.isConnected) applyCover(job.el, url);
            } finally {
                pdf.destroy();
            }
        }

        function applyCover(el, url) {
            const skel = el.querySelector('.cover-skel');
            if (skel) skel.remove();
            const img = document.createElement('img');
            img.src = url;
            img.alt = '';
            img.className = 'absolute inset-0 w-full h-full object-cover object-top';
            el.appendChild(img);
        }

        function applyCoverFallback(el) {
            const skel = el.querySelector('.cover-skel');
            if (!skel) return;
            skel.classList.remove('animate-pulse');
            skel.classList.add('text-[#E10600]/50');
        }

        /* ---------- Render kartu ---------- */
        const FILE_LABELS = { pka: 'Packet Tracer', zip: 'Arsip', rar: 'Arsip', docx: 'Word', doc: 'Word', pptx: 'PowerPoint', xlsx: 'Excel', txt: 'Teks', md: 'Markdown', rsc: 'Skrip MikroTik' };

        const ICON_PDF = '<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>';
        const ICON_FOLDER = '<svg class="w-16 h-16" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>';
        const ICON_DL = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>';

        function coverMarkup(isDir, ext, name, path) {
            if (isDir) return `<div class="book-folder">${ICON_FOLDER}</div>`;
            if (ext === 'pdf') {
                return `<div class="book"><div class="cover-skel absolute inset-0 flex items-center justify-center bg-slate-50 text-slate-300 animate-pulse pl-2">${ICON_PDF}</div></div>`;
            }
            if (IMG_EXT.includes(ext)) {
                return `<div class="book"><img src="${rawUrl(path)}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover"></div>`;
            }
            const label = FILE_LABELS[ext] || '';
            return `<div class="book"><div class="absolute inset-0 flex flex-col items-center justify-center gap-1.5 bg-slate-50 pl-2">
                <span class="font-mono text-2xl text-[#002D72]">${ext ? '.' + escapeHtml(ext.toUpperCase()) : 'FILE'}</span>
                ${label ? `<span class="text-[10px] text-slate-400">${escapeHtml(label)}</span>` : ''}
            </div></div>`;
        }

        /* ---------- Cover folder (gambar sendiri: cover.jpg / .png / .webp di dalam folder) ---------- */
        const COVER_NAME = /^cover\.(jpe?g|png|webp)$/i;
        let folderCovers = new Map();

        function buildFolderCovers() {
            folderCovers = new Map();
            fullTree.forEach(item => {
                if (item.type !== 'blob') return;
                const i = item.path.lastIndexOf('/');
                if (i === -1) return;
                const dir = item.path.slice(0, i);
                const base = item.path.slice(i + 1);
                if (COVER_NAME.test(base) && !folderCovers.has(dir)) folderCovers.set(dir, item.path);
            });
        }

        function applyFolderCovers() {
            fileGrid.querySelectorAll('[data-folder-path]').forEach(card => {
                const coverPath = folderCovers.get(card.dataset.folderPath);
                const el = card.querySelector('.book-folder');
                if (!coverPath || !el || el.querySelector('img.folder-cover')) return;
                const img = document.createElement('img');
                img.className = 'folder-cover absolute inset-0 w-full h-full object-cover';
                img.alt = '';
                img.loading = 'lazy';
                img.onload = () => {
                    const icon = el.querySelector('svg');
                    if (icon) icon.style.visibility = 'hidden';
                    const chip = document.createElement('span');
                    chip.className = 'absolute right-2 bottom-2 z-10 flex items-center rounded px-1.5 py-1 bg-[#002D72]/85 text-white pointer-events-none';
                    chip.innerHTML = '<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>';
                    el.appendChild(chip);
                };
                img.onerror = () => img.remove();
                img.src = rawUrl(coverPath);
                el.appendChild(img);
            });
        }

        function renderFiles(files, mode = 'normal') {
            showLoading(false);
            coverObserver.disconnect();
            coverQueue = [];
            fileGrid.innerHTML = '';
            backBar.innerHTML = '';
            backBar.classList.add('hidden');

            const visibleFiles = files.filter(file => {
                const n = file.name || file.path.split('/').pop();
                return n.toLowerCase() !== 'index.html' && !COVER_NAME.test(n);
            });
            emptyStateEl.classList.toggle('hidden', visibleFiles.length !== 0);

            if (mode === 'normal' && currentPath !== '') {
                const parentPath = currentPath.split('/').slice(0, -1).join('/');
                const back = document.createElement('button');
                back.type = 'button';
                back.className = 'inline-flex items-center gap-2 text-[#00A19C] hover:text-[#002D72] text-[11px] font-black uppercase tracking-widest transition';
                back.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg> Kembali';
                back.onclick = () => fetchContents(parentPath);
                backBar.appendChild(back);
                backBar.classList.remove('hidden');
            }

            visibleFiles.forEach(file => {
                const name = file.name || file.path.split('/').pop();
                const path = file.path;
                const type = file.type === 'tree' ? 'dir' : (file.type === 'blob' ? 'file' : file.type);
                const isDir = type === 'dir';
                const size = file.size || 0;
                const ext = isDir ? '' : getExt(name);
                const meta = isDir ? 'Folder' : `${ext ? ext.toUpperCase() : 'FILE'}${size ? ' · ' + formatBytes(size) : ''}`;

                const card = document.createElement('div');
                card.className = 'card group relative flex flex-col min-w-0';
                if (isDir) card.dataset.folderPath = path;
                card.innerHTML = `
                    <div class="relative">
                        <button type="button" data-role="open" class="block w-full text-left rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-[#00A19C] focus-visible:ring-offset-2" aria-label="${isDir ? 'Buka folder' : 'Preview'} ${escapeHtml(name)}">
                            ${coverMarkup(isDir, ext, name, path)}
                        </button>
                        ${isDir ? '' : `<span class="ext-chip">${escapeHtml(ext ? ext.toUpperCase() : 'FILE')}</span>
                        <div class="card-actions absolute top-2 right-2 flex gap-1 z-10">
                            <button type="button" data-role="download" class="p-1.5 rounded-md bg-white/90 text-slate-500 shadow hover:text-[#E10600] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#00A19C]" title="Download" aria-label="Download ${escapeHtml(name)}">${ICON_DL}</button>
                        </div>`}
                    </div>
                    <button type="button" data-role="open" class="mt-2.5 text-left min-w-0 focus:outline-none">
                        <span class="block text-[13px] font-semibold leading-snug text-slate-700 line-clamp-2 break-words group-hover:text-[#002D72] transition" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
                        <span class="block mt-0.5 text-[10px] font-mono text-slate-400">${escapeHtml(meta)}</span>
                        ${mode === 'search' ? `<span class="block text-[9px] text-slate-400 font-mono truncate">${escapeHtml(path)}</span>` : ''}
                    </button>
                `;

                card.querySelectorAll('[data-role="open"]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (isDir) fetchContents(path);
                        else openPreview(path, name, size);
                    });
                });
                const dlBtn = card.querySelector('[data-role="download"]');
                if (dlBtn) dlBtn.addEventListener('click', (e) => { e.stopPropagation(); downloadFile(path, name); });

                fileGrid.appendChild(card);

                if (ext === 'pdf') {
                    const coverEl = card.querySelector('.book');
                    if (coverCache.has(path)) {
                        applyCover(coverEl, coverCache.get(path));
                    } else {
                        coverEl._coverJob = { path, size, el: coverEl };
                        coverObserver.observe(coverEl);
                    }
                }
            });
            applyFolderCovers();
        }

        function showLoading(isLoading) { loadingEl.classList.toggle('hidden', !isLoading); }

        function updateBreadcrumbs(path, isSearch = false) {
            if (isSearch) { breadcrumbsEl.innerHTML = `<span class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> GLOBAL SEARCH</span>`; return; }
            breadcrumbsEl.innerHTML = '';
            const root = document.createElement('span');
            root.className = 'cursor-pointer hover:text-[#002D72] transition uppercase';
            root.textContent = '/ root';
            root.onclick = () => fetchContents('');
            breadcrumbsEl.appendChild(root);
            if (path) {
                path.split('/').forEach((part, idx, arr) => {
                    const accPath = arr.slice(0, idx + 1).join('/');
                    const sep = document.createElement('span');
                    sep.className = 'mx-2 text-slate-300';
                    sep.textContent = '/';
                    const item = document.createElement('span');
                    item.className = 'cursor-pointer hover:text-[#002D72] transition uppercase';
                    item.textContent = part;
                    item.onclick = () => fetchContents(accPath);
                    breadcrumbsEl.appendChild(sep);
                    breadcrumbsEl.appendChild(item);
                });
            }
        }

        function clearSearch() { searchInput.value = ''; fetchContents(''); }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (term === '') { fetchContents(currentPath); return; }
            isSearchMode = true;
            updateBreadcrumbs('', true);
            const filtered = fullTree.filter(item => {
                const name = item.path.split('/').pop().toLowerCase();
                return name.includes(term) && name !== 'index.html' && !COVER_NAME.test(name);
            });
            renderFiles(filtered, 'search');
        });

        fetchFullTree(); 
        fetchContents(''); 
    </script>
</body>
